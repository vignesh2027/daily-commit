name: Daily Commit

on:
  schedule:
    # every two hours: twelve chances a day for a green square, so a
    # GitHub-side runner outage has to last a very long time to cost a day
    - cron: '0 0 * * *'   # 05:30 IST
    - cron: '0 2 * * *'   # 07:30 IST
    - cron: '0 4 * * *'   # 09:30 IST
    - cron: '0 6 * * *'   # 11:30 IST
    - cron: '0 8 * * *'   # 13:30 IST
    - cron: '0 10 * * *'   # 15:30 IST
    - cron: '0 12 * * *'   # 17:30 IST
    - cron: '0 14 * * *'   # 19:30 IST
    - cron: '0 16 * * *'   # 21:30 IST
    - cron: '0 18 * * *'   # 23:30 IST
    - cron: '0 20 * * *'   # 01:30 IST
    - cron: '0 22 * * *'   # 03:30 IST
  workflow_dispatch:

# Never let two runs fight over the same push.
concurrency:
  group: daily-commit
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    # Fail fast instead of burning 15 min when GitHub can't hand us a runner.
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Commit and push
        run: |
          git config user.name "vignesh2027"
          git config user.email "applemacbook6sep2004@gmail.com"

          # Retry: a racing run may push first, leaving us non-fast-forward.
          for attempt in 1 2 3 4 5; do
            echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_updated.txt
            git add last_updated.txt
            # --allow-empty so a green square still lands if the file is unchanged.
            git commit --allow-empty -m "chore: update $(date -u '+%Y-%m-%d %H:%M')"

            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            echo "push failed, rebasing and retrying ($attempt/5)"
            git pull --rebase origin main
            sleep $((attempt * 5))
          done

          echo "could not push after 5 attempts"
          exit 1
